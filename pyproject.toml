[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlasdataplatform"
version = "0.1.0"
description = "AtlasDataPlatform — Marketing Intelligence Operating System"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AtlasDataPlatform Team" }]

dependencies = [
    "streamlit==1.40.2",
    "starlette>=0.37.0,<1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.20.0",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
youtube = ["google-api-python-client>=2.120.0"]
trends = ["pytrends>=4.9.2"]
reddit = ["praw>=7.7.0"]
supabase = ["supabase>=2.4.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
